# Весь контент сайта. Схема: src/content.config.ts.
# Новый проект = новая запись в projects. Порядок в файле = порядок на сайте.

meta:
  title: Иван Артамонов — бэкенд-разработчик
  description: Портфолио бэкенд-разработчика на Python и Go. Проекты можно потрогать вживую.

profile:
  name: Иван Артамонов
  location: Москва
  greeting: |- # переносы строк сохраняются; на узком экране строки переносятся сами
    Привет, меня зовут Ваня,
    я бэкенд-разработчик на Python и Go.
    Я не умею играть в карты и
    не люблю материться
  links: # в шапке слева направо
    - { label: GitHub, url: https://github.com/HollowKaeden }
    - { label: Telegram, url: https://t.me/BlessNT }
    - { label: Резюме, url: /resume.pdf }

projects:
  - slug: bookreviews
    title: BookReviews
    summary: Каталог прочитанных мною книг с отзывами
    description: >-
      Здесь живут книги, которые я прочитал, читаю сейчас или бросил на середине,
      и что я о них думаю. Это моя настоящая полка, её можно полистать.
      Под капотом открытый API со Swagger, миграции и тесты,
      которые в CI прогоняются и на SQLite, и на настоящем PostgreSQL.
    stack: [FastAPI, PostgreSQL, SQLAlchemy 2, Alembic, Jinja2, Docker, GitHub Actions]
    repo: https://github.com/HollowKaeden/BookReviews
    demo: { type: link, subdomain: books }

  - slug: foodgram
    title: Фудграм
    summary: Сервис рецептов с подписками, избранным и списком покупок
    description: >-
      Сайт для тех, кто любит готовить: публикуешь рецепты, подписываешься на авторов,
      сохраняешь понравившееся в избранное. Самое практичное здесь корзина: добавляешь
      несколько рецептов, и сервис сам собирает общий список покупок, складывая
      одинаковые ингредиенты. Выпускной проект курса Яндекс Практикума: фронтенд
      был готовым, бэкенд и деплой мои.
    stack: [Python 3.9, Django 3.2, DRF, PostgreSQL, Gunicorn, Nginx, React, Docker]
    repo: https://github.com/HollowKaeden/foodgram-st
    demo: { type: link, subdomain: foodgram }

  - slug: http-loadgen
    title: http-loadgen
    summary: Генератор HTTP-нагрузки на Go с перцентилями латентности
    description: >-
      Утилита, которая засыпает сервер запросами и показывает, как он держится:
      сколько запросов в секунду выдерживает, сколько ждут самые медленные ответы
      и какие ошибки начинают сыпаться. Работает в двух режимах: нагружает сервер
      до предела или держит заданный темп, например ровно 200 запросов в секунду. Ниже можно нагрузить
      этот самый сайт и смотреть на график вживую, но не больше чем наполовину:
      сайту ещё работать.
    stack: [Go, net/http, context, GitHub Actions]
    repo: https://github.com/HollowKaeden/http-loadgen
    demo: { type: loadgen-form }

  - slug: portfolio
    title: Моё портфолио
    summary: Вы сейчас на этом сайте. Статика на Astro и инфраструктура для всех проектов
    description: >-
      Всё, что есть на этом сайте, работает на одном небольшом сервере, который
      я настроил сам. У каждого проекта свой поддомен и автоматический HTTPS,
      а после пуша в GitHub проект сам собирается и выкатывается на сервер.
      Базы данных каждый день бэкапятся: книжную полку было бы особенно жалко.
    stack: [Astro, TypeScript, Caddy, Docker Compose, GitHub Actions]
    repo: https://github.com/HollowKaeden/portfolio

