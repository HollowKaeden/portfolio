name: deploy

on:
  # после сборки образа сайта (из build.yml)
  workflow_call:
  # правки конфигурации деплоя, образы не меняются
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/deploy.yml
  # передеплой из пет-проектов после пуша их образов
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/givemeanoffer
  DOMAIN: ${{ vars.DOMAIN || 'givemeanoffer.ru' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          CFG

      - name: Copy deploy/
        # .env и данные на сервере не трогаем
        run: rsync -az --delete --exclude .env --exclude 'backups/' deploy/ vps:$APP_DIR/

      - name: Pull and up
        run: |
          ssh vps "set -e
            cd $APP_DIR
            test -f .env || { echo 'нет $APP_DIR/.env, скопируйте из .env.example'; exit 1; }
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            # Caddyfile мог поменяться без пересоздания контейнера
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker image prune -f >/dev/null"

      - name: Health
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$1" || true)
              if [ "$code" = "$2" ]; then echo "ok   $1 → $code"; return 0; fi
              sleep 3
            done
            echo "FAIL $1 → $code (ожидали $2)"; return 1
          }
          check "https://$DOMAIN/" 200
          check "https://www.$DOMAIN/" 301

      - name: Logs on failure
        if: failure()
        run: ssh vps "cd $APP_DIR && docker compose ps && docker compose logs --tail=100"
