name: build-deploy

# Один workflow на всё:
# - push в main: собрать образ сайта → задеплоить;
# - вручную или сигнал из пет-проекта (их образы обновились): сборку сайта пропустить, сразу задеплоить.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - deploy/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/**
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

# Прогоны идут строго по очереди: деплой не прерывается на середине.
concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/givemeanoffer
  DOMAIN: ${{ vars.DOMAIN || 'givemeanoffer.ru' }}

jobs:
  build:
    # Образ сайта меняется только от коммитов в этот репозиторий.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hollowkaeden/portfolio
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DOMAIN=${{ env.DOMAIN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # always() нужен, чтобы деплой запускался и когда build пропущен (ручной запуск, сигнал из проекта).
    # При упавшей сборке деплоя нет.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ vars.VPS_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            # без keepalive тихий долгий шаг (pull большого образа) обрывался примерно через 5 минут
            ServerAliveInterval 30
            ServerAliveCountMax 10
          CFG

      - name: Copy deploy/
        # .env и данные на сервере не трогаем
        run: rsync -az --delete --exclude .env --exclude 'backups/' deploy/ vps:$APP_DIR/

      - name: Pull and up
        run: |
          ssh vps "set -e
            cd $APP_DIR
            test -f .env || { echo 'нет $APP_DIR/.env, скопируйте из .env.example'; exit 1; }
            docker compose pull --quiet
            # Сначала Postgres и роли/БД проектов: init-скрипт сам по себе выполняется
            # только на пустом volume, а новые проекты добавляются на живой сервер.
            docker compose up -d --wait postgres
            docker compose exec -T postgres sh /docker-entrypoint-initdb.d/10-databases.sh
            docker compose up -d --remove-orphans
            # Caddyfile мог поменяться без пересоздания контейнера
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker image prune -f >/dev/null"

      - name: Health
        run: |
          check() {
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$1" || true)
              if [ "$code" = "$2" ]; then echo "ok   $1 → $code"; return 0; fi
              sleep 3
            done
            echo "FAIL $1 → $code (ожидали $2)"; return 1
          }
          check "https://$DOMAIN/" 200
          check "https://www.$DOMAIN/" 301
          check "https://books.$DOMAIN/health" 200
          check "https://books.$DOMAIN/ready" 200   # заодно проверяет связь с БД
          check "https://foodgram.$DOMAIN/" 200
          check "https://foodgram.$DOMAIN/api/recipes/?limit=1" 200

      - name: Logs on failure
        if: failure()
        run: ssh vps "cd $APP_DIR && docker compose ps && docker compose logs --tail=100"
