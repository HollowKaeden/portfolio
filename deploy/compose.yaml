name: givemeanoffer

# Сети:
# - proxy: Caddy и приложения за ним. У Caddy фиксированный адрес, чтобы приложения
#   доверяли X-Forwarded-* только от него (FORWARDED_ALLOW_IPS и аналоги).
# - db: внутренняя, только приложения и Postgres; Caddy в неё не входит, наружу выхода нет.
x-caddy-ip: &caddy-ip 172.30.0.2

# Образы: маленькие (сайт, BookReviews) в ghcr; Фудграм в Docker Hub, потому что ghcr
# с сервера в России качается в ~150 раз медленнее, а образы Фудграма большие.
# Логин Docker Hub: FOODGRAM_IMAGE_PREFIX=docker.io/<логин> в .env.

services:
  caddy:
    image: ghcr.io/hollowkaeden/portfolio:${PORTFOLIO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    volumes:
      # папка, а не файл: при замене файла rsync-ом bind-mount файла показывал бы старую версию
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    networks:
      proxy:
        ipv4_address: *caddy-ip
        # loadgen ходит на сайты по настоящим https-адресам через внутреннюю сеть
        aliases:
          - ${DOMAIN}
          - books.${DOMAIN}
          - foodgram.${DOMAIN}

  postgres:
    image: postgres:16
    restart: unless-stopped
    # Под 1 vCPU / 2 ГБ: небольшой буфер и мало соединений (uvicorn 1 воркер, gunicorn 3).
    command: postgres -c shared_buffers=128MB -c max_connections=40
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BOOKREVIEWS_DB_PASSWORD: ${BOOKREVIEWS_DB_PASSWORD:?задайте BOOKREVIEWS_DB_PASSWORD в .env}
      FOODGRAM_DB_PASSWORD: ${FOODGRAM_DB_PASSWORD:?задайте FOODGRAM_DB_PASSWORD в .env}
      PVZ_DB_PASSWORD: ${PVZ_DB_PASSWORD:?задайте PVZ_DB_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    networks:
      - db

  bookreviews:
    image: ghcr.io/hollowkaeden/bookreviews:${BOOKREVIEWS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bookreviews:${BOOKREVIEWS_DB_PASSWORD}@postgres:5432/bookreviews
      ADMIN_USERNAME: ${BOOKREVIEWS_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${BOOKREVIEWS_ADMIN_PASSWORD:?задайте BOOKREVIEWS_ADMIN_PASSWORD в .env}
      UPLOAD_DIR: /app/uploads
      # uvicorn читает эту переменную сам: X-Forwarded-* принимаются только от Caddy
      FORWARDED_ALLOW_IPS: *caddy-ip
    volumes:
      - bookreviews_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    networks:
      - proxy
      - db

  foodgram-backend:
    image: ${FOODGRAM_IMAGE_PREFIX:?задайте FOODGRAM_IMAGE_PREFIX в .env}/foodgram-backend:${FOODGRAM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # миграции при старте; gunicorn 3 воркера (2 x CPU + 1)
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn foodgram_backend.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --access-logfile -"
    environment:
      POSTGRES_DB: foodgram
      POSTGRES_USER: foodgram
      POSTGRES_PASSWORD: ${FOODGRAM_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${FOODGRAM_SECRET_KEY:?задайте FOODGRAM_SECRET_KEY в .env}
      DEBUG: "False"
      ALLOWED_HOSTS: foodgram.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: foodgram.${DOMAIN} # в Django 3.2 без схемы
      # за Caddy: https и хост из X-Forwarded-*, IP клиента из X-Forwarded-For (один прокси)
      SECURE_PROXY_SSL_HEADER: "True"
      USE_X_FORWARDED_HOST: "True"
      NUM_PROXIES: 1
      # троттлинг только регистрации и логина; GET-ручки без лимита (их нагружает loadgen)
      REGISTER_THROTTLE_RATE: 5/hour
      LOGIN_THROTTLE_RATE: 10/minute
      # картинки грузят незнакомые люди, диск 30 ГБ
      MAX_IMAGE_SIZE_MB: 5
    volumes:
      - foodgram_media:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(urllib.request.Request(
          'http://localhost:8000/api/recipes/?limit=1',
          headers={'Host': 'foodgram.${DOMAIN}'})).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    networks:
      - proxy
      - db

  # nginx: сборка React, статика Django, медиа; /api/, /admin/, /s/ проксирует на foodgram-backend
  foodgram-gateway:
    image: ${FOODGRAM_IMAGE_PREFIX}/foodgram-gateway:${FOODGRAM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - foodgram-backend
    volumes:
      - foodgram_media:/media:ro
    mem_limit: 64m
    networks:
      - proxy

  # Форма нагрузки на сайте: API под /loadgen/api/ (префикс срезает Caddy).
  # Цели ходит по настоящим https-адресам: в сети proxy они указывают на Caddy (алиасы выше),
  # поэтому мерится вся цепочка TLS -> прокси -> приложение -> БД, без выхода в интернет.
  loadgen-web:
    image: ghcr.io/hollowkaeden/loadgen-web:${LOADGEN_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TARGETS: /config/targets.json
      TRUSTED_PROXY: *caddy-ip # IP посетителя из X-Forwarded-For только от Caddy
      LISTEN: ":8080"
    volumes:
      - ./loadgen:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/status"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    networks:
      - proxy

  # ПВЗ-сервис (Go, distroless). Миграции при старте. Демо публичное: данные
  # сбрасываются каждую ночь (pvz-reset.sh), в бэкап не входят.
  pvz:
    image: ghcr.io/hollowkaeden/pvz-service:${PVZ_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pvz:${PVZ_DB_PASSWORD}@postgres:5432/pvz?sslmode=disable
      JWT_SECRET: ${PVZ_JWT_SECRET:?задайте PVZ_JWT_SECRET в .env}
      MIGRATE_ON_START: "true"
      # Postgres общий на все проекты (max_connections 40)
      DB_MAX_CONNS: 5
      TRUSTED_PROXIES: *caddy-ip # IP посетителя из X-Forwarded-For только от Caddy
      GOMEMLIMIT: 100MiB # мягкий предел для сборщика мусора Go, ниже mem_limit
    healthcheck:
      # в образе нет shell и curl: проверку делает сам бинарник
      test: ["CMD", "pvz", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks:
      - proxy
      - db

volumes:
  caddy_data: # сертификаты, терять нельзя: Let's Encrypt ограничивает перевыпуск
  caddy_config:
  postgres_data: # БД всех проектов, в бэкапе
  bookreviews_uploads: # обложки книг, в бэкапе
  foodgram_media: # картинки рецептов и аватары; каждую ночь сбрасываются к эталону (foodgram-reset.sh)

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Автоматические адреса только из верхней половины. Иначе контейнер, созданный,
          # пока Caddy пересоздаётся, может занять его фиксированный 172.30.0.2, и Caddy
          # не стартует (так и случилось 2026-10-13 при первом деплое loadgen-web).
          ip_range: 172.30.0.128/25
  db:
    internal: true
