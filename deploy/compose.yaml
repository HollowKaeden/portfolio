name: givemeanoffer

# Сети:
# - proxy: Caddy и приложения за ним. У Caddy фиксированный адрес, чтобы приложения
#   доверяли X-Forwarded-* только от него (FORWARDED_ALLOW_IPS и аналоги).
# - db: внутренняя, приложения, Postgres и Kafka; Caddy в неё не входит, наружу выхода нет.
x-caddy-ip: &caddy-ip 172.30.0.2

# Образы: маленькие (сайт, BookReviews) в ghcr; Фудграм в Docker Hub, потому что ghcr
# с сервера в России качается в ~150 раз медленнее, а образы Фудграма большие.
# Логин Docker Hub: FOODGRAM_IMAGE_PREFIX=docker.io/<логин> в .env.

services:
  caddy:
    image: ghcr.io/hollowkaeden/portfolio:${PORTFOLIO_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      GOMEMLIMIT: 160MiB
    volumes:
      # папка, а не файл: при замене файла rsync-ом bind-mount файла показывал бы старую версию
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # cgroup достигал прежних 128m; оставляем запас поверх Go runtime.
    mem_limit: 192m
    networks:
      proxy:
        ipv4_address: *caddy-ip
        # loadgen ходит на сайты по настоящим https-адресам через внутреннюю сеть
        aliases:
          - ${DOMAIN}
          - books.${DOMAIN}
          - foodgram.${DOMAIN}

  postgres:
    image: postgres:16
    restart: unless-stopped
    # Под 1 vCPU / 2 ГБ: небольшой буфер и мало соединений (uvicorn 1 воркер, gunicorn 3).
    command: postgres -c shared_buffers=128MB -c max_connections=40
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BOOKREVIEWS_DB_PASSWORD: ${BOOKREVIEWS_DB_PASSWORD:?задайте BOOKREVIEWS_DB_PASSWORD в .env}
      FOODGRAM_DB_PASSWORD: ${FOODGRAM_DB_PASSWORD:?задайте FOODGRAM_DB_PASSWORD в .env}
      PVZ_DB_PASSWORD: ${PVZ_DB_PASSWORD:?задайте PVZ_DB_PASSWORD в .env}
      PVZ_BILLING_DB_PASSWORD: ${PVZ_BILLING_DB_PASSWORD:?задайте PVZ_BILLING_DB_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m
    networks:
      - db

  bookreviews:
    image: ghcr.io/hollowkaeden/bookreviews:${BOOKREVIEWS_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bookreviews:${BOOKREVIEWS_DB_PASSWORD}@postgres:5432/bookreviews
      ADMIN_USERNAME: ${BOOKREVIEWS_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${BOOKREVIEWS_ADMIN_PASSWORD:?задайте BOOKREVIEWS_ADMIN_PASSWORD в .env}
      UPLOAD_DIR: /app/uploads
      # uvicorn читает эту переменную сам: X-Forwarded-* принимаются только от Caddy
      FORWARDED_ALLOW_IPS: *caddy-ip
    volumes:
      - bookreviews_uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    networks:
      - proxy
      - db

  foodgram-backend:
    image: ${FOODGRAM_IMAGE_PREFIX:?задайте FOODGRAM_IMAGE_PREFIX в .env}/foodgram-backend:${FOODGRAM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # миграции при старте; gunicorn 3 воркера (2 x CPU + 1)
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn foodgram_backend.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --access-logfile -"
    environment:
      POSTGRES_DB: foodgram
      POSTGRES_USER: foodgram
      POSTGRES_PASSWORD: ${FOODGRAM_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      SECRET_KEY: ${FOODGRAM_SECRET_KEY:?задайте FOODGRAM_SECRET_KEY в .env}
      DEBUG: "False"
      ALLOWED_HOSTS: foodgram.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: foodgram.${DOMAIN} # в Django 3.2 без схемы
      # за Caddy: https и хост из X-Forwarded-*, IP клиента из X-Forwarded-For (один прокси)
      SECURE_PROXY_SSL_HEADER: "True"
      USE_X_FORWARDED_HOST: "True"
      NUM_PROXIES: 1
      # троттлинг только регистрации и логина; GET-ручки без лимита (их нагружает loadgen)
      REGISTER_THROTTLE_RATE: 5/hour
      LOGIN_THROTTLE_RATE: 10/minute
      # картинки грузят незнакомые люди, диск 30 ГБ
      MAX_IMAGE_SIZE_MB: 5
    volumes:
      - foodgram_media:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(urllib.request.Request(
          'http://localhost:8000/api/recipes/?limit=1',
          headers={'Host': 'foodgram.${DOMAIN}'})).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    networks:
      - proxy
      - db

  # nginx: сборка React, статика Django, медиа; /api/, /admin/, /s/ проксирует на foodgram-backend
  foodgram-gateway:
    image: ${FOODGRAM_IMAGE_PREFIX}/foodgram-gateway:${FOODGRAM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - foodgram-backend
    volumes:
      - foodgram_media:/media:ro
    mem_limit: 64m
    networks:
      - proxy

  # Форма нагрузки на сайте: API под /loadgen/api/ (префикс срезает Caddy).
  # Цели ходит по настоящим https-адресам: в сети proxy они указывают на Caddy (алиасы выше),
  # поэтому мерится вся цепочка TLS -> прокси -> приложение -> БД, без выхода в интернет.
  loadgen-web:
    image: ghcr.io/hollowkaeden/loadgen-web:${LOADGEN_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TARGETS: /config/targets.json
      TRUSTED_PROXY: *caddy-ip # IP посетителя из X-Forwarded-For только от Caddy
      LISTEN: ":8080"
    volumes:
      - ./loadgen:/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/status"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    networks:
      - proxy

  # История метрик ПВЗ и billing. UI/API доступны через SSH-туннель к loopback VPS.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Go оставляет запас до жёстких 192m, запросы ограничены под одно ядро VPS.
      - --auto-gomemlimit.ratio=0.8
      - --query.max-concurrency=2
      - --query.max-samples=500000
      - --query.timeout=10s
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # rsync заменяет файлы: монтируем каталог, затем перечитываем через SIGHUP.
      - ./prometheus:/etc/prometheus:ro
      - ./backups/monitoring:/etc/prometheus-targets:ro
      - prometheus_data:/prometheus
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    mem_limit: 192m
    networks:
      - proxy
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.vmstat
      - --collector.diskstats
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker|var/lib/containerd)($$|/)
    environment:
      GOMEMLIMIT: 48MiB
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ./backups/metrics:/textfile:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    environment:
      GOMEMLIMIT: 48MiB
    volumes:
      - ./blackbox:/etc/blackbox:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9115/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks:
      - monitoring

  # ПВЗ-сервис (Go, distroless). Миграции при старте. Демо публичное: данные
  # сбрасываются каждую ночь (pvz-reset.sh), в бэкап не входят.
  pvz:
    image: ghcr.io/hollowkaeden/pvz-service:${PVZ_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pvz:${PVZ_DB_PASSWORD}@postgres:5432/pvz?sslmode=disable
      JWT_SECRET: ${PVZ_JWT_SECRET:?задайте PVZ_JWT_SECRET в .env}
      MIGRATE_ON_START: "true"
      # Postgres общий на все проекты (max_connections 40)
      DB_MAX_CONNS: 5
      TRUSTED_PROXIES: *caddy-ip # IP посетителя из X-Forwarded-For только от Caddy
      # /register и /login с одного IP: защита от перебора паролей, а bcrypt на
      # 1 vCPU дорогой. Остальные ручки лимит не трогает.
      AUTH_RATE_LIMIT: 10/1m
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: pvz.reception.closed
      GOMEMLIMIT: 100MiB # мягкий предел для сборщика мусора Go, ниже mem_limit
    healthcheck:
      # в образе нет shell и curl: проверку делает сам бинарник
      test: ["CMD", "pvz", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks:
      - proxy
      - db

  # Брокер доступен только приложениям в db. pvz не ждёт его готовности:
  # при остановке Kafka API продолжает работать, события копятся в outbox.
  billing:
    image: ghcr.io/hollowkaeden/pvz-service:${PVZ_TAG:-latest}
    entrypoint: ["billing"]
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BILLING_DATABASE_URL: postgres://pvz_billing:${PVZ_BILLING_DB_PASSWORD}@postgres:5432/pvz_billing?sslmode=disable
      BILLING_DB_MAX_CONNS: 3
      BILLING_MIGRATE_ON_START: "true"
      KAFKA_BROKERS: kafka:19092
      KAFKA_TOPIC: pvz.reception.closed
      BILLING_CONSUMER_GROUP: pvz-billing
      GOMEMLIMIT: 48MiB
    healthcheck:
      test: ["CMD", "billing", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    networks:
      - proxy
      - db

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_MS: 86400000
      KAFKA_LOG_RETENTION_BYTES: 33554432
      KAFKA_LOG_SEGMENT_BYTES: 8388608
      KAFKA_LOG_ROLL_MS: 3600000
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5
    mem_limit: 512m
    networks:
      - db

volumes:
  caddy_data: # сертификаты, терять нельзя: Let's Encrypt ограничивает перевыпуск
  caddy_config:
  postgres_data: # БД всех проектов, в бэкапе
  kafka_data: # журнал демо: сутки хранения, в бэкап не входит
  prometheus_data: # история метрик; 7 дней / целевой размер 512MB, в бэкап не входит
  bookreviews_uploads: # обложки книг, в бэкапе
  foodgram_media: # картинки рецептов и аватары; каждую ночь сбрасываются к эталону (foodgram-reset.sh)

networks:
  # Blackbox использует публичный DNS. Алиасы Caddy из proxy здесь отсутствуют.
  monitoring:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Автоматические адреса только из верхней половины. Иначе контейнер, созданный,
          # пока Caddy пересоздаётся, может занять его фиксированный 172.30.0.2, и Caddy
          # не стартует (так и случилось 2026-10-13 при первом деплое loadgen-web).
          ip_range: 172.30.0.128/25
  db:
    internal: true
