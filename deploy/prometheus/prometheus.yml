# Продовый сбор: локальная конфигурация pvz-service остаётся отдельной.
global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s
  sample_limit: 5000

storage:
  tsdb:
    retention:
      time: 7d
      size: 512MB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: pvz
    static_configs:
      - targets: ["pvz:9000"]
  - job_name: billing
    static_configs:
      - targets: ["billing:9001"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]
  - job_name: https
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /probe
    file_sd_configs:
      - files: ["/etc/prometheus-targets/https.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
